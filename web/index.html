<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Desk</title>
<style>
/* Layout: left rail of sections, right pane = one store at a time; summary first, detail below. */
:root{
  --bg:#f5f6f4;--panel:#fff;--ink:#1d2321;--muted:#5f6b66;--line:#dde2df;--accent:#2f6f5e;--accent-ink:#fff;--soft:#e8f0ec;
  --ok:#2e7d4f;--warn:#a86a00;--bad:#b3392f;--auto:#2f5f9e;--ok-bg:#e6f3ea;--warn-bg:#fbf0dc;--bad-bg:#f8e4e1;--auto-bg:#e5edf8;
  --f-body:"Segoe UI",system-ui,sans-serif;--f-mono:Consolas,ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--panel:#1c2220;--ink:#e6ebe8;--muted:#9aa7a1;--line:#2c3431;--accent:#6fbfa6;--accent-ink:#0f1513;--soft:#22302b;
  --ok:#7fd29d;--warn:#e7b45c;--bad:#ef8a7f;--auto:#8fb4ea;--ok-bg:#1f3227;--warn-bg:#352a17;--bad-bg:#3a2220;--auto-bg:#1e2a3b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding:0 16px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 0 40px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0}
header .proj{color:var(--muted);font-size:13px;font-family:var(--f-mono);display:flex;flex-wrap:wrap;gap:8px;align-items:center}header .proj .btn{font-family:var(--f-body);color:var(--ink)}
.wrap.empty{grid-template-columns:minmax(0,1fr)}.wrap.empty nav,.wrap.empty header{display:none}
.start{max-width:560px;margin:10vh auto 0;display:flex;flex-direction:column;gap:14px}
.start h1{margin:0;font-size:24px}.start p{margin:0;color:var(--muted)}
.recent{display:flex;flex-direction:column;gap:6px}.recent button{text-align:left;font-family:var(--f-mono);font-size:12px}
nav{display:flex;flex-direction:column;gap:4px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:7px;color:var(--ink);text-decoration:none}
nav a:hover{background:var(--soft)}
nav a[aria-current]{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
nav .sep{height:1px;background:var(--line);margin:8px 4px}
nav small{color:var(--muted)}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.head h2{margin:0;font-size:22px}
.head p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,input,textarea,select{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.box h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 0 12px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.auto{background:var(--auto-bg);color:var(--auto)}.hand{background:var(--soft);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;color:var(--ink);text-decoration:none}
.card b{font-size:16px}.card small{color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;border-top:none;font-size:12px}
.mono{font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere}
.field{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.field:first-of-type{border-top:none}
.field label{color:var(--muted);font-size:13px;padding-top:4px}
.in{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg)}
.meta{font-size:11px;color:var(--muted);white-space:nowrap}
.copy{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.steps li>.chip{justify-self:end}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--ink)}th.sort[data-dir]::after{content:attr(data-dir);font-family:"Material Symbols Outlined";font-size:14px;margin-left:3px;vertical-align:-2px;font-feature-settings:"liga"}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;width:30%;background:var(--accent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.progress i{animation:none;width:100%;opacity:.5}}
.steps li:first-child{border-top:none}
.mark{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.t{font-weight:600}.d{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.d a{color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:none;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs.sub{border:none;gap:6px;margin:12px 0 0;flex-wrap:wrap}.tabs.sub button{border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin:0}
.tabs.sub button[aria-selected=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:middle}
.pane>.box:only-child>h3:first-child{display:none}
details.check{border-top:1px solid var(--line);padding:8px 0}details.check summary{cursor:pointer}
details.guide{margin-top:6px}details.guide summary{cursor:pointer;color:var(--accent);font-weight:600}details.guide ol{margin:6px 0 0;padding-left:20px}details.guide li{display:list-item;padding:3px 0;margin:0;background:none;box-shadow:none;border:none}
.log{font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:420px;overflow:auto;margin:0}
.note{font-size:12px;color:var(--muted)}
.job{font-size:13px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:8px 0}
.shot{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.shot img,.noshot{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.noshot{display:grid;place-items:center;color:var(--muted);font-size:12px}
.shot figcaption{padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.shot figcaption .copy{margin-left:auto}
.thumb{display:block;max-width:120px;max-height:60px;margin-bottom:4px;border-radius:4px;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/12px 12px}
.si{display:inline-block;width:16px;height:16px;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat;vertical-align:-3px;margin-right:7px;flex:none}
.si.steam{--i:url(/icons/steam.svg)}.si.epic{--i:url(/icons/epicgames.svg)}.si.play{--i:url(/icons/googleplay.svg)}.si.gog{--i:url(/icons/gogdotcom.svg)}.si.microsoft{--i:url(/icons/microsoftstore.svg)}.si.itch{--i:url(/icons/itchdotio.svg)}.si.apple{--i:url(/icons/apple.svg)}.si.meta{--i:url(/icons/meta.svg)}.si.nintendoswitch{--i:url(/icons/nintendoswitch.svg)}.si.playstation{--i:url(/icons/playstation.svg)}.si.xbox{--i:url(/icons/xbox.svg)}
.tablewrap{overflow-x:auto}table.compare td,table.compare th{vertical-align:top}table.compare td:first-child a{white-space:nowrap;display:inline-flex;align-items:center}.cellbtn{border:none;background:none;padding:0;cursor:pointer;text-align:left}.cellbtn[aria-expanded=true] .chip{outline:2px solid var(--accent)}.celldetail td{background:var(--soft)}.grouprow th{padding-top:14px;font-size:13px;color:var(--ink)}
.storegroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.storegroup h4{margin:0 0 6px;font-size:13px;color:var(--muted)}.storeon{display:flex;align-items:center;gap:6px;padding:4px 0}
nav [hidden]{display:none}
.navhead{font-size:12px;color:var(--muted);padding:2px 10px}.nav-eval{display:flex;flex-direction:column;gap:4px}.navhead{margin-top:6px}
.fit{width:9px;height:9px;border-radius:50%;flex:none}.fit.ok{background:var(--ok)}.fit.warn{background:var(--warn)}.fit.bad{background:var(--bad)}.fit.unknown{background:var(--muted)}
.disclaimer{border-left:4px solid var(--muted)}.disclaimer.ok{border-left-color:var(--ok)}.disclaimer.warn{border-left-color:var(--warn)}.disclaimer.bad{border-left-color:var(--bad)}
.evalsteps{list-style:none;padding:0;margin:0}.evalsteps li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.evalsteps li:first-child{border-top:none}.evalsteps input{margin-top:4px}
nav a span{display:flex;align-items:center}
.ov{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
.in:disabled{opacity:.6}
.pick{display:flex;flex-wrap:wrap;gap:8px 16px;margin:4px 0 8px}.pick label{display:flex;gap:6px;align-items:center}
ul.changes{margin:0;padding-left:16px;font-size:12px;color:var(--muted)}
@font-face{font-family:"Material Symbols Outlined";font-style:normal;font-weight:400;font-display:block;src:url(/fonts/material-symbols.woff2) format("woff2")}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:18px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"opsz" 20;vertical-align:-4px;flex:none}
.btn .ms,.copy .ms{margin-right:6px}.copy .ms{font-size:15px;vertical-align:-3px}.chip .ms{font-size:14px;vertical-align:-2px;margin-right:3px}
nav .ms{margin-right:7px}.mark .ms{font-size:18px}.mark.ok .ms{font-variation-settings:"FILL" 1,"opsz" 20}
.select{position:relative;display:block}.select select{appearance:none;-webkit-appearance:none;padding-left:12px;padding-right:40px;cursor:pointer}
.select::after{content:"expand_more";font-family:"Material Symbols Outlined";font-feature-settings:"liga";font-size:20px;line-height:1;position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.box h3:has(+.sub){display:inline-block;margin-right:10px}.box h3+.sub{display:inline-block;margin:0 0 12px}
.phead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.phead .meter{grid-column:1/-1;height:8px}.phead .row{font-size:13px;color:var(--muted);min-width:0}
.link{border:none;background:none;padding:0;color:var(--accent);cursor:pointer;font:inherit;text-align:left}.link:hover{text-decoration:underline}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:30px;height:28px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{border-color:var(--accent)}.iconbtn .ms{margin:0}
.steps li.focus{outline:2px solid var(--accent);outline-offset:-2px}
nav small.lvl{font-weight:600;padding:1px 7px;border-radius:999px}.lvl.done{background:var(--ok-bg);color:var(--ok)}.lvl.part{background:var(--warn-bg);color:var(--warn)}.lvl.none{background:var(--bad-bg);color:var(--bad)}
.steps li.is-ok{background:color-mix(in srgb,var(--ok-bg) 55%,transparent);box-shadow:inset 3px 0 0 var(--ok);border-radius:8px;padding-left:10px;padding-right:8px}
.steps li.is-todo{background:color-mix(in srgb,var(--warn-bg) 45%,transparent);box-shadow:inset 3px 0 0 var(--warn);border-radius:8px;padding-left:10px;padding-right:8px}
.steps li.is-ok .t{color:var(--ok)}.steps li{margin-bottom:6px;border-top:none}
.mark.hand{color:var(--warn)}.mark.ok{color:var(--ok)}
.steps .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.guide .glink{font-weight:600;white-space:nowrap}
.steps .tick{display:flex;gap:5px;align-items:center;font-size:12px;cursor:pointer;white-space:nowrap}
.flash{animation:flash 1.6s ease-out}@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid var(--accent)}}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:13px;max-width:60ch}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}nav{flex-direction:row;flex-wrap:wrap}nav .sep{display:none}.cards{grid-template-columns:minmax(0,1fr)}.field{grid-template-columns:minmax(0,1fr) auto}.field label{grid-column:1/-1}}
</style>

<body>
<div class="wrap" id="wrap">
  <header><h1 id="title">Release Desk</h1><span class="proj"><span id="proj"></span><button class="btn" data-act="refresh"><span class="ms" aria-hidden="true">refresh</span>Refresh</button><button class="btn" data-act="browse"><span class="ms" aria-hidden="true">swap_horiz</span>Switch</button></span></header>
  <nav id="nav">
    <a href="#overview"><span><span class="ms" aria-hidden="true">space_dashboard</span>Overview</span></a>
    <div class="sep"></div>
    <div class="navhead" data-head="pc">PC</div>
    <a href="#steam" data-store="steam" data-group="pc"><span><i class="si steam"></i>Steam</span> <small id="nav-steam"></small></a>
    <a href="#itch" data-store="itch" data-group="pc"><span><i class="si itch"></i>itch.io</span> <small id="nav-itch"></small></a>
    <a href="#epic" data-store="epic" data-group="pc"><span><i class="si epic"></i>Epic Games Store</span> <small id="nav-epic"></small></a>
    <a href="#gog" data-store="gog" data-group="pc"><span><i class="si gog"></i>GOG</span> <small id="nav-gog"></small></a>
    <a href="#microsoft" data-store="microsoft" data-group="pc"><span><i class="si microsoft"></i>Microsoft Store</span> <small id="nav-microsoft"></small></a>
    <div class="navhead" data-head="android">Android</div>
    <a href="#itch-android" data-store="itch-android" data-group="android"><span><i class="si itch"></i>itch.io Android</span> <small id="nav-itch-android"></small></a>
    <a href="#play" data-store="play" data-group="android"><span><i class="si play"></i>Google Play</span> <small id="nav-play"></small></a>
    <a href="#samsung" data-store="samsung" data-group="android"><span><span class="ms" aria-hidden="true">storefront</span>Galaxy Store</span> <small id="nav-samsung"></small></a>
    <div class="navhead" data-head="xr">XR</div>
    <div class="nav-eval" data-group="xr"></div>
    <div class="navhead" data-head="console">Console</div>
    <div class="nav-eval" data-group="console"></div>
    <div class="navhead" data-head="apple">Apple</div>
    <div class="nav-eval" data-group="apple"></div>
    <span id="nav-end" hidden></span>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
};
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3000); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copied"); } catch { toast("Copy failed; select the text instead"); } }
const ic = name => `<span class="ms" aria-hidden="true">${name}</span>`;
const chipIcon = {ok: "check", bad: "error", warn: "warning", auto: "bolt"};
const chip = (state, label) => `<span class="chip ${state}">${chipIcon[state] ? ic(chipIcon[state]) : ""}${esc(label)}</span>`;
const kindChip = k => ({hand: `<span class="chip hand">${ic("front_hand")}by hand</span>`, copy: `<span class="chip hand">${ic("content_copy")}copy</span>`, desk: chip("auto", "desk")})[k] || "";
const mark = s => s === "ok" ? `<span class="mark ok">${ic("check_circle")}</span>` : `<span class="mark hand">${ic("radio_button_unchecked")}</span>`;
// Every page keeps its sections as tabs, and a tab's sections as subtabs. All panes render; one shows,
// so switching keeps unsaved edits and goTo can open whichever panes hold its target.
const tabState = {};
const setTab = (key, id) => { tabState[key] = id; };
function tabs(key, panes, sub = false) {
  panes = panes.filter(p => p && p[2]);
  if (!panes.length) return "";
  if (sub && panes.length === 1) return panes[0][2];
  if (!panes.some(p => p[0] === tabState[key])) tabState[key] = panes[0][0];
  const cur = tabState[key];
  const flag = html => /data-problem|chip bad/.test(html) ? `<i class="dot" title="Something to fix here"></i>` : "";
  return `<div class="tabs${sub ? " sub" : ""}" role="tablist" data-tabkey="${key}">${panes.map(([id, label, html]) => `<button role="tab" aria-selected="${id === cur}" data-tab="${id}">${label}${flag(html)}</button>`).join("")}</div>`
    + panes.map(([id, , html]) => `<div class="pane" data-owner="${key}" data-id="${id}" ${id === cur ? "" : "hidden"}>${html}</div>`).join("");
}
function selectTab(key, id) {
  tabState[key] = id;
  document.querySelectorAll(`[data-tabkey="${key}"] > button`).forEach(b => b.setAttribute("aria-selected", b.dataset.tab === id));
  document.querySelectorAll(`.pane[data-owner="${key}"]`).forEach(p => p.hidden = p.dataset.id !== id);
}
const STORE_NAMES = {steam: "Steam", itch: "itch.io", "itch-android": "itch.io Android", epic: "Epic Games Store", gog: "GOG", microsoft: "Microsoft Store", play: "Google Play", samsung: "Galaxy Store"};
let stepFocus = {store: "", index: -1};
// Progress for a store page header: bar, count (opens all steps), next open step, and arrows through the open steps.
function progressHead(store, steps, label = "") {
  const done = steps.filter(x => x.state === "ok").length;
  const open = steps.map((x, i) => [x, i]).filter(([x]) => x.state !== "ok");
  const shown = stepFocus.store === store && steps[stepFocus.index] && steps[stepFocus.index].state !== "ok" ? [steps[stepFocus.index], stepFocus.index] : open[0];
  return `<div class="phead"><div class="meter"><i style="width:${Math.round(100 * done / Math.max(1, steps.length))}%"></i></div>
    <div class="row">${label ? `${storeIcon(store)}<b>${esc(label)}</b> · ` : ""}<button class="link" data-act="steps-all" data-store="${store}">${done} of ${steps.length} done</button>${shown
      ? ` · ${stepFocus.store === store ? "" : "next: "}<button class="link" ${shown[0].go ? `data-act="go" data-go="${esc(shown[0].go)}"` : `data-act="step-go" data-store="${store}" data-index="${shown[1]}"`}>${esc(shown[0].title)}</button>` : " · all done"}</div>
    ${open.length ? `<span class="actions"><button class="iconbtn" data-act="step-prev" data-store="${store}" aria-label="Previous open step" title="Previous open step">${ic("chevron_left")}</button><button class="iconbtn" data-act="step-next" data-store="${store}" aria-label="Next open step" title="Next open step">${ic("chevron_right")}</button></span>` : ""}</div>`;
}
// Opens page/tab and scrolls to the element that fixes a step; focuses a field that has a problem.
async function goTo(target) {
  const [page, tab, anchor] = target.split("/");
  if (tab) setTab(page, tab);
  if (location.hash !== "#" + page) { location.hash = "#" + page; await new Promise(r => setTimeout(r, 0)); }
  await render();
  const el = document.getElementById(anchor);
  if (!el) return;
  for (let p = el.closest(".pane"); p; p = p.parentElement.closest(".pane")) selectTab(p.dataset.owner, p.dataset.id);
  el.scrollIntoView({block: "center", behavior: "smooth"});
  const field = el.matches("input,textarea,select") ? el : el.querySelector("[data-problem]");
  const mark = el.closest(".field") || el.closest("tr") || el;

// Stores side by side: age, AI and runtime script, own AI account, credits. A cell opens its details under the row.
const LVL = {ok: "ok", warn: "warn", bad: "bad", unknown: "hand"};
function compareBox(c) {
  const head = `<tr><th>Store</th>${c.columns.map(col => `<th>${esc(col.label)}</th>`).join("")}</tr>`;
  const groupRow = g => `<tr class="grouprow"><th colspan="${c.columns.length + 1}">${esc(g[1])}</th></tr>`;
  const rows = c.groups.map(g => groupRow(g) + c.stores.filter(s => s.group === g[0]).map(s => `<tr><td><a href="${esc(s.page)}">${s.icon ? `<i class="si ${esc(s.icon)}"></i>` : ""}${esc(s.name)}</a>${s.planned ? "" : ` <span class="note">to evaluate</span>`}</td>${c.columns.map(col => {
      const cell = s.cells[col.key] || {short: "?", level: "unknown"};
      return `<td><button class="cellbtn" data-cell="${esc(s.id)}:${esc(col.key)}" aria-expanded="false">${chip(LVL[cell.level] || "hand", cell.short)}</button></td>`;
    }).join("")}</tr><tr class="celldetail" data-detail-for="${esc(s.id)}" hidden><td colspan="${c.columns.length + 1}"></td></tr>`).join("")).join("");
  const must = `<div class="box"><h3>For players from 8, through a parent's account</h3><ul>${c.product.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  return `<div class="box" id="compare"><h3>Stores</h3><p class="note sub">Click a cell for details and the source. Checked ${esc(c.checked)}; store rules change, so verify before release.</p>
    <div class="tablewrap"><table class="compare">${head}${rows}</table></div></div>${must}`;
}
function storesBox(sl) {
  const row = x => `<label class="storeon"><input type="checkbox" data-store-on="${esc(x.id)}" ${x.on ? "checked" : ""}>${x.kind === "desk" ? storeIcon(x.id) : x.icon ? `<i class="si ${esc(x.icon)}"></i>` : ic("storefront")}${esc(x.name)}${x.kind === "evaluate" ? ` <span class="note">to evaluate</span>` : ""}</label>`;
  const groups = sl.groups.map(([g, label]) => { const list = sl.stores.filter(x => x.group === g); return list.length ? `<div class="storegroup"><h4>${esc(label)}</h4>${list.map(row).join("")}</div>` : ""; }).join("");
  return `<div class="box" id="stores-on"><h3>Stores on this desk</h3><p class="note sub">Only the stores ticked here show in the menu, Overview, Build all and the board status page. Saved at once to Store/store.json; a store added to the desk later starts ticked.</p>

// Menu: hide stores turned off for this project, and a group heading with nothing left under it.
async function navStores(view) {
  const sl = await api("/api/stores");
  const on = new Set(sl.stores.filter(x => x.on).map(x => x.id));
  document.querySelectorAll("#nav a[data-store]").forEach(a => a.hidden = !on.has(a.dataset.store));
  document.querySelectorAll(".nav-eval").forEach(box => box.innerHTML = sl.stores.filter(x => x.kind === "evaluate" && x.on && x.group === box.dataset.group).map(x => `<a href="#eval-${esc(x.id)}" title="To evaluate · ${esc(FIT[x.fit])}"><span>${x.icon ? `<i class="si ${esc(x.icon)}"></i>` : ic("storefront")}${esc(x.name)}</span> <i class="fit ${esc(x.fit)}"></i></a>`).join(""));
  document.querySelectorAll("#nav .navhead[data-head]").forEach(h => h.hidden = !sl.stores.some(x => x.on && x.group === h.dataset.head));
  const nav = $("#nav");
  const end = $("#nav-end");
  sl.groups.forEach(([g]) => nav.querySelectorAll(`.navhead[data-head="${g}"], [data-group="${g}"]`).forEach(el => nav.insertBefore(el, end)));
  document.querySelectorAll(".nav-eval a").forEach(a => a.getAttribute("href") === "#" + view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
}
// A store turned off still opens by its link; show that instead of its page, with a way to turn it back on.

let COMPARE = null;
async function openCell(btn) {

// Release check: the build laptop builds, tests and explores one pushed commit (Tools/Test-On-Laptop.ps1 over SSH).
const stateChip = st => chip(st === "passed" ? "ok" : st === "failed" ? "bad" : "hand", st || "unknown");
function checkBox(ck) {
  const h = ck.head;
  const picks = Object.entries(ck.steps).map(([k, label]) => `<label><input type="checkbox" data-check-step="${k}" checked>${esc(label)}</label>`).join("");
  const ready = ck.supported && h.pushed;
  const why = !ck.supported ? `The laptop side is not ready yet: ${esc(ck.script)} does not take release-check requests (card #72).`
    : !h.pushed ? `${esc(h.short)} is not on origin yet; push it first.` : "";
  const res = ck.results.map(x => `<details class="check"><summary>${stateChip(x.state)} <b class="mono">${esc(x.request)}</b> <span class="mono">${esc(String(x.commit || "").slice(0, 9))}</span> <span class="note">${esc(x.finished || x.started || "")}</span><div class="note">${esc(x.summary || "")}</div></summary>
    <table><tr><th>Step</th><th></th><th>Time</th><th>Result</th></tr>${(x.steps || []).map(st => `<tr><td>${esc(ck.steps[st.name] || st.name)}</td><td>${stateChip(st.state)}</td><td>${st.minutes != null ? st.minutes + " min" : ""}</td><td>${esc(st.summary || "")}${(st.details && st.details.failures || []).length ? `<ul class="changes">${st.details.failures.map(f => `<li class="mono">${esc(f)}</li>`).join("")}</ul>` : ""}</td></tr>`).join("")}</table>
    ${(x.builds || []).length ? `<table><tr><th>Build</th><th>Size</th><th>sha256</th></tr>${x.builds.map(bd => `<tr><td class="mono">${esc(bd.name || bd.file)}</td><td>${bd.sizeMB != null ? bd.sizeMB + " MB" : esc(bd.size || "")}</td><td class="mono">${esc(String(bd.sha256 || "").slice(0, 16))}…</td></tr>`).join("")}</table>` : ""}
    <p class="note mono">Logs/release-check/${esc(x.request)}</p></details>`).join("");
  return `<div class="box" id="release-check"><h3>Release check</h3>
    <p>Commit <b class="mono">${esc(h.short || "none")}</b> on <span class="mono">${esc(h.branch)}</span> · ${esc(h.subject)} ${h.pushed ? chip("ok", "pushed") : chip("bad", "not pushed")}${h.dirty ? " " + chip("warn", "uncommitted changes are not included") : ""}</p>
    <div class="pick">${picks}</div>
    <div class="field"><label for="check-seed">Explore seed</label><div><input id="check-seed" class="in mono" placeholder="random"><div class="note">Set it to replay an earlier Explore run exactly.</div></div><span></span></div>
    <div class="actions"><button class="btn primary" data-act="release-check" ${ready ? "" : "disabled"}>${ic("check_circle")}Check this release candidate</button></div>
    ${why ? `<p class="note">${why}</p>` : ""}
    <p class="note">The build laptop checks out this commit and runs the picked steps; progress shows under Runs and Cancel stops the laptop run. It goes over your own SSH key; the desk holds no key. Dev builds stay on the laptop and the test phone (they include the debug server); only results come back.</p></div>
    ${res ? `<div class="box"><h3>Earlier checks</h3>${res}</div>` : ""}`;
}

  const [r, k] = await Promise.all([api("/api/release"), api("/api/keys")]);
  const fields = d.fields.map(f => `<div class="field"><label for="${id}-f-${f.key}">${esc(f.label)}</label>
    <div>${f.multiline ? `<textarea id="${id}-f-${f.key}" class="in" rows="6" ${f.problem && !f.readonly ? "data-problem" : ""} ${f.readonly ? "disabled" : ""}>${esc(f.value)}</textarea>` : `<input id="${id}-f-${f.key}" class="in" value="${esc(f.value)}" ${f.readonly ? "disabled" : ""} ${f.problem && !f.readonly ? "data-problem" : ""}>`}${f.note ? `<div class="note">${esc(f.note)}</div>` : ""}</div>
    <div><span class="meta">${f.value.length}${f.max ? " / " + f.max : ""}</span> <button class="copy" data-copyfrom="${id}-f-${f.key}">${ic("content_copy")}Copy</button>${f.problem ? "<br>" + chip("bad", f.problem) : ""}</div></div>`).join("");
  const builds = `<div class="box" id="${id}-builds">${buildTable(id, d.build.history, [["uploaded", title, h => h.uploaded ? chip("ok", h.uploaded) : h.exists ? chip("hand", "not uploaded") : chip("hand", "replaced")]])}
    <p class="note mono">${esc(d.build.folder)}</p>${buildActions}</div>`;
  return storePage(id, title, intro, d.steps, [
    listingTabs(id, r, `<div class="box" id="${id}-text"><h3>Text</h3>${fields}<div class="actions"><button class="btn primary" data-act="save-hand" data-store="${id}">${ic("save")}Save</button></div></div>`, artBox(id, d), await shotsBox(id, d.screenshots)),
    ["builds", "Builds", builds], ["keys", "Keys &amp; accounts", keysBox(id, k)], ["steps", "Setup steps", stepsBox(d.steps, id)]]);
}
function artBox(store, s) {
  const rows = s.art.map(a => `<tr><td>${a.state !== "missing" && a.state !== "optional" && /\.(png|jpg)$/.test(a.file) ? `<img class="thumb" src="/store-file/${encodeURI(a.file)}?t=${Date.now()}" alt="">` : ""}${esc(a.label)}</td><td class="mono">${esc(a.expected)}</td><td class="mono">${esc(a.file)}</td><td>${
    a.state === "ok" ? chip("ok", "ok") : a.state === "optional" ? chip("hand", "optional") : a.state === "missing" ? chip("bad", "missing") : chip("bad", a.problem)}</td></tr>`).join("");
  return `<div class="box" id="${store}-art"><h3>Art</h3><p class="note sub mono">Store/${store}/art</p><table><tr><th>Image</th><th>Size</th><th>File</th><th></th></tr>${rows}</table>
    <p class="note">Put each image at the file name shown (PNG unless noted), or make them. Sizes from the store's docs, checked ${esc(s.rules.checked)}.</p>
    <div class="actions"><button class="btn" data-act="capsules">${ic("view_quilt")}Make capsules</button><button class="btn" data-act="icons">${ic("apps")}Make icons</button></div>
    <p class="note">Make capsules crops the key art (Store/shots/art/key-art.png, from the key-art shot) to each size and places the logo (Store/art/logo.png); focus and logo boxes can be tuned per output in Store/art.json. Make icons resizes Store/art/icon.png (square, 1024×1024) to every store icon size. Both write every store's files.</p></div>`;
}
// Step by step: a numbered list under a step, each line with its own link or desk place.
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return "link"; } };
// The guide opens on the first unfinished step that has one, so the next thing to do by hand is always spelled out.
const openStep = steps => steps.findIndex(y => y.state !== "ok" && (y.guide || []).length);
const guideList = (g, open) => (g || []).length ? `<details class="guide" ${open ? "open" : ""}><summary>Step by step</summary><ol>${g.map(x => `<li>${x.link ? `<a class="glink" href="${esc(x.link)}" target="_blank" rel="noopener">${ic("open_in_new")}${esc(hostOf(x.link))}</a> ` : ""}${esc(x.text)}${x.go ? ` <button class="copy" data-act="go" data-go="${esc(x.go)}">${ic("arrow_forward")}Go</button>` : ""}</li>`).join("")}</ol><p class="note">Looks different? Send a screenshot on the board card.</p></details>` : "";
const stepsBox = (steps, store) => `<div class="box"><ol class="steps">${steps.map((x, i) => `<li data-step="${i}" class="${x.state === "ok" ? "is-ok" : "is-todo"} ${stepFocus.store === store && stepFocus.index === i ? "focus" : ""}">${mark(x.state)}<div><div class="t">${esc(x.title)}</div><div class="d">${esc(x.detail)}${x.link ? ` <a href="${esc(x.link)}" target="_blank" rel="noopener">Open ${ic("open_in_new")}</a>` : ""}</div>${guideList(x.guide, i === openStep(steps))}</div><div class="side">${kindChip(x.kind)}${x.tick ? `<label class="tick"><input type="checkbox" data-tick="${esc(store)}" data-title="${esc(x.title)}" ${x.state === "ok" ? "checked" : ""}>Done</label>` : ""}${x.go ? `<button class="copy" data-act="go" data-go="${esc(x.go)}">${ic("arrow_forward")}Go</button>` : ""}</div></li>`).join("")}</ol></div>`;
async function shotsBox(store, summary) {
  const list = (await api("/api/shots")).shots.filter(x => (x.stores || []).includes(store));
  const cards = list.map(x => {
    const f = x.files.find(f => f.store === store);
    return `<figure class="shot">${f ? `<img src="/store-file/${encodeURI(f.file)}?t=${encodeURIComponent(f.made)}" alt="${esc(x.name)}" loading="lazy">` : `<div class="noshot">${ic("image_not_supported")} not captured</div>`}
      <figcaption><span class="mono">${esc(x.name)}</span> <span class="note">${x.width}×${x.height}${f ? " · " + esc(f.made) : ""}</span>
      <button class="copy" data-act="capture" data-only="${esc(x.name)}">${ic("photo_camera")}Capture</button></figcaption></figure>`;
  }).join("");
  return `<div class="box" id="${store}-shots"><h3>Screenshots</h3><p class="note sub mono">Store/shots/${esc(store)}</p>
    <p>${summary.good} of ${summary.min} usable. Each shot is set up by its Flecs Script in Store/shots.json; Unity plays, renders the exact size without UI, and returns to edit mode.</p>
    <div class="shots">${cards || `<p class="note">No shots for this store in Store/shots.json.</p>`}</div>
    <div class="actions"><button class="btn primary" data-act="capture">${ic("photo_camera")}Capture all</button></div><p class="note">${esc(summary.note)}</p></div>`;
}
const mmss = sec => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
function jobsBox(jobs) {
  const names = Object.keys(jobs || {});
  if (!names.length) return "";
  return `<div class="box"><h3>Runs</h3>${names.map(n => {
    const j = jobs[n];
    if (j.state === "running")
      return `<div class="job"><b>${esc(n)}</b> ${chip("warn", "running " + mmss(j.elapsed || 0))} <button class="copy" data-act="cancel-job" data-job="${esc(n)}">${ic("close")}Cancel</button><div class="progress"><i></i></div><span class="note">${esc(j.activity || "Working…")}</span></div>`;
    const took = j.ended && j.started ? " · " + mmss(Math.round(j.ended - j.started)) : "";
    return `<div class="job"><b>${esc(n)}</b> ${chip(j.state === "done" ? "ok" : j.state === "cancelled" ? "hand" : "bad", j.state + took)} <span class="mono">${esc(j.message)}</span></div>`;
  }).join("")}</div>`;
}

// Build history table, sortable by any column when there is more than one build.
const sorts = {};
function buildTable(id, rows, extra) {
  const cols = [["version", "Version", h => `<span class="mono">${esc(h.version)} (${esc(h.build)})</span>`],
    ["branch", "Branch", h => `<span class="mono">${esc(h.branch || "—")}</span> <span class="note mono">${esc(h.commit || "")}</span>`],
    ["minutes", "Build time", h => h.minutes != null ? `${h.minutes} min` : "—"],
    ["sizeMB", "Size", h => h.sizeMB != null ? `<span class="mono">${h.sizeMB} MB</span>` : "—"],
    ["finished", "Made", h => esc(h.finished)],
    ["changes", "Changes", h => (h.changes || []).length ? `<ul class="changes">${h.changes.map(c => `<li>${esc(c)}</li>`).join("")}</ul><button class="copy" data-text="${esc(h.changes.map(c => "• " + c).join("\n"))}">${ic("content_copy")}Copy</button>` : "—"], ...extra];
  if (!rows.length) return `<p class="note">No builds yet.</p>`;
  const st = sorts[id] || {key: "finished", dir: -1};
  const val = (h, k) => k === "version" ? String(h.version).split(".").map(n => n.padStart(5, "0")).join(".") + String(h.build).padStart(8, "0")
    : typeof h[k] === "number" ? h[k] : String(h[k] ?? "");
  const sorted = [...rows].sort((a, b) => { const x = val(a, st.key), y = val(b, st.key); return (x > y ? 1 : x < y ? -1 : 0) * st.dir; });
  const head = cols.map(([k, label]) => rows.length > 1 ? `<th class="sort" data-sort="${id}:${k}" ${st.key === k ? `data-dir="${st.dir > 0 ? "arrow_upward" : "arrow_downward"}"` : ""}>${label}</th>` : `<th>${label}</th>`).join("");
  const body = sorted.map(h => `<tr>${cols.map(([, , f]) => `<td>${f(h)}</td>`).join("")}${h.result && h.result !== "Succeeded" ? `<td>${chip("bad", h.result)}</td>` : ""}</tr>`).join("");
  return `<table><tr>${head}</tr>${body}</table>`;
}

let renderSeq = 0;
async function render() {
  const seq = ++renderSeq;  // a slower, older render must not overwrite a newer one
  const view = (location.hash || "#overview").slice(1);
  document.querySelectorAll("#nav a").forEach(a => a.getAttribute("href") === "#" + view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const start = await api("/api/start").catch(() => ({project: "", recent: []}));
  if (start.project) api("/api/progress").then(list => list.forEach(s => {
    const el = $("#nav-" + s.id);
    if (el) { el.textContent = `${s.done}/${s.total}`; el.className = "lvl " + levelOf(s.done, s.total); el.title = `${s.done} of ${s.total} setup steps done`; }
  })).catch(() => {});
  let html;
  // Stores to evaluate sit in their platform group, marked by the fit dot instead of a step count.
  if (start.project) navStores(view).catch(() => {});
  const evalView = view.startsWith("eval-") ? () => views.evaluate(view.slice(5)) : null;
  const off = start.project ? await offStore(view) : null;
  try { html = !start.project ? await views.start(start) : off || await (views[view] || evalView || views.overview)(); }
  catch (e) { html = `<div class="box">${chip("bad", "error")} ${esc(e.message)}</div>`; }
  if (seq !== renderSeq) return;
  $("#wrap").classList.toggle("empty", !start.project);
  $("#proj").textContent = start.project;
  $("#title").textContent = start.title || "Release Desk";
  document.title = start.title ? `${start.title} · Release Desk` : "Release Desk";
  $("#main").innerHTML = html;
  trackEdits();
  updateJobs();
}

// Save buttons appear only while their box differs from what was loaded.
const saveScope = b => b.closest(".field:has(input + button[data-act^=save])") || b.closest(".box");
const snapshot = scope => JSON.stringify([...scope.querySelectorAll("input,textarea,select")].map(el => el.type === "checkbox" ? el.checked : el.value));
function trackEdits() {
  document.querySelectorAll("#main [data-act^=save]").forEach(b => { b.dataset.loaded = snapshot(saveScope(b)); b.hidden = true; });
}
function edited(e) {
  document.querySelectorAll("#main [data-act^=save]").forEach(b => { if (saveScope(b).contains(e.target)) b.hidden = snapshot(saveScope(b)) === b.dataset.loaded; });
}
document.addEventListener("input", edited);
window.addEventListener("hashchange", render);
// Logins and key set-ups finish in their own window (console or browser). When you come back to the desk, show the
// new state (each time, until you open another page), unless something typed here is not saved yet.
let awaitingConsole = false;
window.addEventListener("focus", () => {
  if (!awaitingConsole) return;
  if ([...document.querySelectorAll("#main [data-act^=save]")].some(b => !b.hidden)) return;
  render();
});
window.addEventListener("hashchange", () => { awaitingConsole = false; });

// Live progress: while any run is going, refresh the Runs box every 3 s; when it ends, redraw the page.
let polling = null, wasRunning = false;
async function updateJobs() {
  const jobs = await api("/api/jobs").catch(() => ({}));
  const box = $("#jobs");
  if (box) box.innerHTML = jobsBox(jobs);
  const running = Object.values(jobs).some(j => j.state === "running");
  if (running && !polling) polling = setInterval(updateJobs, 3000);
  if (!running && polling) { clearInterval(polling); polling = null; }
  if (wasRunning && !running) { wasRunning = false; return render(); }
  wasRunning = running;
}

document.addEventListener("change", e => {
  edited(e);
  if (e.target.matches("[data-stores-first]")) { api("/api/stores", {first: [e.target.value]}).then(() => { COMPARE = null; toast("Order saved"); return render(); }).catch(err => toast(err.message)); return; }
  const so = e.target.closest("[data-store-on]");
  if (so) { api("/api/stores", {[so.dataset.storeOn]: so.checked}).then(() => { COMPARE = null; toast(so.checked ? "Shown on this desk" : "Hidden on this desk"); return render(); }).catch(err => toast(err.message)); return; }
  const ev = e.target.closest("[data-eval-step]");
  if (ev) { const id = location.hash.slice(6); const doneList = [...document.querySelectorAll("[data-eval-step]:checked")].map(el => +el.dataset.evalStep); api("/api/evaluate/" + id, {done: doneList}).then(() => render()).catch(err => toast(err.message)); return; }
  const tk = e.target.closest("[data-tick]");
  if (tk) { api("/api/ticks", {store: tk.dataset.tick, title: tk.dataset.title, done: tk.checked}).then(() => { toast(tk.checked ? "Marked done" : "Marked not done"); return render(); }).catch(err => toast(err.message)); return; }
  const ov = e.target.closest("[data-ov]");
  if (ov) { const input = $("#rel-" + ov.dataset.ov); input.disabled = !ov.checked; if (ov.checked) input.focus(); }
});
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-tab],[data-copyfrom],[data-text],[data-recent],[data-sort],[data-cell]");
  if (!t) return;
  try {
    if (t.dataset.sort) { const [id, key] = t.dataset.sort.split(":"); const cur = sorts[id] || {key: "finished", dir: -1}; sorts[id] = {key, dir: cur.key === key ? -cur.dir : -1}; return render(); }
    if (t.dataset.tab) return selectTab(t.closest("[data-tabkey]").dataset.tabkey, t.dataset.tab);
    if (t.dataset.copyfrom) return copy($("#" + t.dataset.copyfrom).value);
    if (t.dataset.text !== undefined) return copy(t.dataset.text);
    if (t.dataset.recent) { await api("/api/open", {path: t.dataset.recent}); location.hash = "#overview"; return render(); }
    const act = t.dataset.act;
    if (act === "browse") { const b = await api("/api/browse", {start: $("#proj").textContent}); if (!b.path) return; await api("/api/open", {path: b.path}); location.hash = "#overview"; return render(); }
    if (act === "refresh") { await api("/api/refresh", {}); toast("Refreshed; summary written to the log"); return render(); }
    if (act === "save-release") {
      const values = {}, override = {};
      document.querySelectorAll("[id^=rel-]").forEach(el => values[el.id.slice(4)] = el.value);
      document.querySelectorAll("[data-ov]").forEach(el => override[el.dataset.ov] = el.checked);
      await api("/api/release", {store: t.dataset.store, values, override}); toast("Saved to Store/store.json"); return render();
    }
    if (act === "draft") { const d = await api("/api/release/draft", {}); $("#rel-whatsNew").value = d.text || ""; $("#rel-whatsNew").dispatchEvent(new Event("input", {bubbles: true})); return toast(d.text ? "Release notes from commits; edit, then Save" : "No Release-note lines in commits since the last build"); }
    if (t.dataset.cell) return openCell(t);
    if (act === "save-eval") { const id = t.dataset.store; await api("/api/evaluate/" + id, {notes: $("#eval-notes").value}); toast("Saved to Store/evaluate.json"); return render(); }
    if (act === "release-check") { const steps = [...document.querySelectorAll("[data-check-step]:checked")].map(el => el.dataset.checkStep); if (!steps.length) return toast("Pick at least one step"); await api("/api/check", {steps, seed: $("#check-seed").value.trim()}); toast("Started; progress shows under Runs"); return updateJobs(); }
    if (act === "build-all") { const kinds = [...document.querySelectorAll("[data-kind-pick]:checked")].map(el => el.dataset.kindPick); await api("/api/build/all", {kinds}); toast("Started; progress shows under Runs"); return updateJobs(); }
    if (act === "save-steam") { const d = {}; document.querySelectorAll("[id^=st-]").forEach(el => d[el.id.slice(3)] = el.value); await api("/api/steam/listing", d); toast("Saved to Store/steam/listing.json"); return render(); }
    if (act === "save-play") { const d = {}; document.querySelectorAll("[id^=pl-]").forEach(el => { if (!el.id.startsWith("pl-ro-")) d[el.id.slice(3)] = el.value; }); await api("/api/play/listing", d); toast("Saved to Store/play/listing.json"); return render(); }
    if (act === "steps-all") { stepFocus = {store: "", index: -1}; setTab(t.dataset.store, "steps"); if (location.hash !== "#" + t.dataset.store) { location.hash = "#" + t.dataset.store; return; } return render(); }
    if (act === "step-go") return goToStep(t.dataset.store, +t.dataset.index);
    if (act === "step-next" || act === "step-prev") {
      const store = t.dataset.store, s = await api("/api/" + store);
      const open = s.steps.map((x, i) => x.state !== "ok" ? i : -1).filter(i => i >= 0);
      if (!open.length) return;
      const cur = stepFocus.store === store ? stepFocus.index : (act === "step-next" ? -1 : s.steps.length);
      const index = act === "step-next" ? (open.find(i => i > cur) ?? open[0]) : ([...open].reverse().find(i => i < cur) ?? open[open.length - 1]);
      stepFocus = {store, index};
      return s.steps[index].go ? goTo(s.steps[index].go) : goToStep(store, index);
    }
    if (act === "go") return goTo(t.dataset.go);
    if (act === "save-ids") {
      const section = t.dataset.section, values = {};
      document.querySelectorAll(`[id^=ids-${section}-]`).forEach(el => values[el.id.slice(5 + section.length)] = el.value);
      await api("/api/ids", {[section]: values}); toast("Saved to Store/store.json"); return render();
    }
    if (act === "cancel-job") { await api("/api/jobs/cancel", {name: t.dataset.job}); toast("Cancelling"); return updateJobs(); }
    if (act === "save-hand") { const id = t.dataset.store, d = {}; document.querySelectorAll(`[id^=${id}-f-]`).forEach(el => { if (!el.disabled) d[el.id.slice(id.length + 3)] = el.value; }); await api(`/api/${id}/listing`, d); toast(`Saved to Store/${id}/listing.json`); return render(); }
    if (act === "itch-login") { awaitingConsole = true; const m = await api("/api/itch/login", {}); return toast(m.message); }
    if (act === "ms-setup") { awaitingConsole = true; const m = await api("/api/microsoft/setup", {}); return toast(m.message); }
    if (act === "save-epic") { const d = {}; document.querySelectorAll("[id^=ep-]").forEach(el => { if (!el.id.startsWith("ep-ro-")) d[el.id.slice(3)] = el.value; }); await api("/api/epic/listing", d); toast("Saved to Store/epic/listing.json"); return render(); }
    if (act === "epic-secret") { awaitingConsole = true; const k = await api("/api/epic/secret", {}); return toast(k.message); }
    if (act === "save-play-settings") { await api("/api/play/settings", {track: $("#play-track").value, status: $("#play-status").value}); toast("Saved to Store/store.json"); return render(); }
    if (act === "play-key") { awaitingConsole = true; const k = await api("/api/play/key", {}); return toast(k.message); }
    if (act === "save-user") { await api("/api/keys/steam-user", {user: $("#steam-user").value}); toast("Saved"); return render(); }
    if (act === "copy-log") return copy($("#logtext").textContent);
    if (act === "run-win") { const r = await api("/api/run/windows", {kind: t.dataset.kind || "steam-windows"}); return toast(r.message); }
    const jobs = {"push-unity": ["/api/unity/apply", {}], "build": ["/api/build", {kind: t.dataset.kind}], "install": ["/api/play/install", {}], "capture": ["/api/shots/capture", {only: t.dataset.only || ""}], "icons": ["/api/art/icons", {}], "capsules": ["/api/art/capsules", {}], "play-preview": ["/api/play/publish", {preview: true}], "play-check": ["/api/play/check", {}], "epic-check": ["/api/epic/check", {}], "gog-upload": ["/api/gog/upload", {}], "itch-preview": ["/api/itch/preview", {}], "itch-push": ["/api/itch/push", {}], "itch-install": ["/api/itch/install", {}], "itch-android-preview": ["/api/itch-android/preview", {}], "itch-android-push": ["/api/itch-android/push", {}], "samsung-check": ["/api/samsung/check", {}], "samsung-submit": ["/api/samsung/submit", {}], "ms-package": ["/api/microsoft/package", {}], "ms-publish": ["/api/microsoft/publish", {}], "epic-upload": ["/api/epic/upload", {}], "play-publish": ["/api/play/publish", {preview: false}], "upload-preview": ["/api/steam/upload", {preview: true}], "upload": ["/api/steam/upload", {preview: false}]};
    if (jobs[act]) { await api(...jobs[act]); toast("Started; progress shows under Runs"); updateJobs(); }
  } catch (err) { toast(err.message); }
});
render();
</script>
</body>
