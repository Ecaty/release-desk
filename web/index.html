<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Desk</title>
<style>
/* Layout: left rail of sections, right pane = one store at a time; summary first, detail below. */
:root{
  --bg:#f5f6f4;--panel:#fff;--ink:#1d2321;--muted:#5f6b66;--line:#dde2df;--accent:#2f6f5e;--accent-ink:#fff;--soft:#e8f0ec;
  --ok:#2e7d4f;--warn:#a86a00;--bad:#b3392f;--auto:#2f5f9e;--ok-bg:#e6f3ea;--warn-bg:#fbf0dc;--bad-bg:#f8e4e1;--auto-bg:#e5edf8;
  --f-body:"Segoe UI",system-ui,sans-serif;--f-mono:Consolas,ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--panel:#1c2220;--ink:#e6ebe8;--muted:#9aa7a1;--line:#2c3431;--accent:#6fbfa6;--accent-ink:#0f1513;--soft:#22302b;
  --ok:#7fd29d;--warn:#e7b45c;--bad:#ef8a7f;--auto:#8fb4ea;--ok-bg:#1f3227;--warn-bg:#352a17;--bad-bg:#3a2220;--auto-bg:#1e2a3b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding:0 16px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 0 40px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0}
header .proj{color:var(--muted);font-size:13px;font-family:var(--f-mono);display:flex;flex-wrap:wrap;gap:8px;align-items:center}header .proj .btn{font-family:var(--f-body);color:var(--ink)}
.wrap.empty{grid-template-columns:minmax(0,1fr)}.wrap.empty nav,.wrap.empty header{display:none}
.start{max-width:560px;margin:10vh auto 0;display:flex;flex-direction:column;gap:14px}
.start h1{margin:0;font-size:24px}.start p{margin:0;color:var(--muted)}
.recent{display:flex;flex-direction:column;gap:6px}.recent button{text-align:left;font-family:var(--f-mono);font-size:12px}
nav{display:flex;flex-direction:column;gap:4px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:7px;color:var(--ink);text-decoration:none}
nav a:hover{background:var(--soft)}
nav a[aria-current]{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
nav .sep{height:1px;background:var(--line);margin:8px 4px}
nav small{color:var(--muted)}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.head h2{margin:0;font-size:22px}
.head p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,input,textarea,select{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.box h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 0 12px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.auto{background:var(--auto-bg);color:var(--auto)}.hand{background:var(--soft);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;color:var(--ink);text-decoration:none}
.card b{font-size:16px}.card small{color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;border-top:none;font-size:12px}
.mono{font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere}
.field{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.field:first-of-type{border-top:none}
.field label{color:var(--muted);font-size:13px;padding-top:4px}
.in{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg)}
.meta{font-size:11px;color:var(--muted);white-space:nowrap}
.copy{border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.steps li>.chip{justify-self:end}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--ink)}th.sort[data-dir]::after{content:attr(data-dir);font-family:"Material Symbols Outlined";font-size:14px;margin-left:3px;vertical-align:-2px;font-feature-settings:"liga"}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;width:30%;background:var(--accent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.progress i{animation:none;width:100%;opacity:.5}}
.steps li:first-child{border-top:none}
.mark{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.t{font-weight:600}.d{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.d a{color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:none;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.log{font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:420px;overflow:auto;margin:0}
.note{font-size:12px;color:var(--muted)}
.job{font-size:13px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:8px 0}
.shot{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.shot img,.noshot{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.noshot{display:grid;place-items:center;color:var(--muted);font-size:12px}
.shot figcaption{padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.shot figcaption .copy{margin-left:auto}
.thumb{display:block;max-width:120px;max-height:60px;margin-bottom:4px;border-radius:4px;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/12px 12px}
.si{display:inline-block;width:16px;height:16px;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat;vertical-align:-3px;margin-right:7px;flex:none}
.si.steam{--i:url(/icons/steam.svg)}.si.epic{--i:url(/icons/epicgames.svg)}.si.play{--i:url(/icons/googleplay.svg)}
nav a span{display:flex;align-items:center}
.ov{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);white-space:nowrap}
.in:disabled{opacity:.6}
.pick{display:flex;flex-wrap:wrap;gap:8px 16px;margin:4px 0 8px}.pick label{display:flex;gap:6px;align-items:center}
ul.changes{margin:0;padding-left:16px;font-size:12px;color:var(--muted)}
@font-face{font-family:"Material Symbols Outlined";font-style:normal;font-weight:400;font-display:block;src:url(/fonts/material-symbols.woff2) format("woff2")}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:18px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"opsz" 20;vertical-align:-4px;flex:none}
.btn .ms,.copy .ms{margin-right:6px}.copy .ms{font-size:15px;vertical-align:-3px}.chip .ms{font-size:14px;vertical-align:-2px;margin-right:3px}
nav .ms{margin-right:7px}.mark .ms{font-size:18px}.mark.ok .ms{font-variation-settings:"FILL" 1,"opsz" 20}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:13px;max-width:60ch}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}nav{flex-direction:row;flex-wrap:wrap}nav .sep{display:none}.cards{grid-template-columns:minmax(0,1fr)}.field{grid-template-columns:minmax(0,1fr) auto}.field label{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header><h1 id="title">Release Desk</h1><span class="proj"><span id="proj"></span><button class="btn" data-act="refresh"><span class="ms" aria-hidden="true">refresh</span>Refresh</button><button class="btn" data-act="browse"><span class="ms" aria-hidden="true">swap_horiz</span>Switch</button></span></header>
  <nav id="nav">
    <a href="#overview"><span><span class="ms" aria-hidden="true">space_dashboard</span>Overview</span></a>
    <div class="sep"></div>
    <a href="#steam"><span><i class="si steam"></i>Steam</span> <small id="nav-steam"></small></a>
    <a href="#epic"><span><i class="si epic"></i>Epic Games Store</span> <small id="nav-epic"></small></a>
    <a href="#play"><span><i class="si play"></i>Google Play</span> <small id="nav-play"></small></a>
    <div class="sep"></div>
    <a href="#keys"><span><span class="ms" aria-hidden="true">key</span>Keys &amp; accounts</span></a>
    <a href="#log"><span><span class="ms" aria-hidden="true">receipt_long</span>Log</span></a>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
};
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3000); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copied"); } catch { toast("Copy failed; select the text instead"); } }
const ic = name => `<span class="ms" aria-hidden="true">${name}</span>`;
const chipIcon = {ok: "check", bad: "error", warn: "warning", auto: "bolt"};
const chip = (state, label) => `<span class="chip ${state}">${chipIcon[state] ? ic(chipIcon[state]) : ""}${esc(label)}</span>`;
const kindChip = k => ({hand: `<span class="chip hand">${ic("front_hand")}by hand</span>`, copy: `<span class="chip hand">${ic("content_copy")}copy</span>`, desk: chip("auto", "desk")})[k] || "";
const mark = s => s === "ok" ? `<span class="mark ok">${ic("check_circle")}</span>` : `<span class="mark hand">${ic("radio_button_unchecked")}</span>`;
let steamTab = "listing", playTab = "listing", epicTab = "listing";
const storeIcon = id => `<i class="si ${id}"></i>`;
const fieldInput = (id, f, value, disabled) => f.multiline
  ? `<textarea id="${id}" class="in" rows="4" ${disabled ? "disabled" : ""}>${esc(value)}</textarea>`
  : `<input id="${id}" class="in" ${f.number ? 'type="number" min="1"' : ""} value="${esc(value)}" ${disabled ? "disabled" : ""}>`;
// Shared release on Overview; on a store page the same fields with an override box each.
function releaseBox(r, store) {
  const values = store ? r.stores[store].values : r.shared;
  const rows = Object.entries(r.fields).map(([k, f]) => {
    const own = store && r.stores[store].overrides.includes(k);
    const note = (store && r.stores[store].notes[k]) || f.note || "";
    const side = store ? `<label class="ov"><input type="checkbox" data-ov="${k}" ${own ? "checked" : ""}> override</label>`
      : `<div>${f.max ? `<span class="meta">${String(values[k] ?? "").length} / ${f.max}</span>` : ""}${k === "whatsNew" ? `<br><button class="copy" data-act="draft">${ic("history")}Fill from commits</button>` : ""}</div>`;
    return `<div class="field"><label for="rel-${k}">${esc(f.label)}</label><div>${fieldInput("rel-" + k, f, values[k], store && !own)}${note ? `<div class="note">${esc(note)}</div>` : ""}</div>${side}</div>`;
  }).join("");
  return `<div class="box"><h3>${store ? "Release · unticked fields use the shared value from Overview" : "Release · shared by all stores"}</h3>${rows}
    <div class="actions"><button class="btn primary" data-act="save-release" data-store="${store || ""}">${ic("save")}Save</button>${store ? "" : `<button class="btn" data-act="push-unity">${ic("sync")}Push to Unity</button>`}</div></div>`;
}
function perStore(r) {
  const keys = Object.keys(r.fields);
  const rows = Object.entries(r.stores).map(([id, s]) => `<tr><td>${storeIcon(id)}${esc(s.name)}</td>${keys.map(k => `<td>${s.overrides.includes(k)
    ? `<b>${esc(String(s.values[k]).split("\n")[0].slice(0, 40))}</b> ${chip("auto", "override")}` : `<span class="note">shared</span>`}</td>`).join("")}</tr>`).join("");
  return `<div class="box"><h3>Per store</h3><table><tr><th>Store</th>${keys.map(k => `<th>${esc(r.fields[k].label)}</th>`).join("")}</tr>${rows}</table></div>`;
}
function buildAllBox(r) {
  const picks = Object.entries(r.kinds).map(([k, label]) => `<label><input type="checkbox" data-kind-pick="${k}" ${k === "play-aab" ? "" : "checked"}>${storeIcon(r.buildStore[k])}${esc(label)}</label>`).join("");
  return `<div class="box"><h3>Build all</h3><div class="pick">${picks}</div>
    <p class="note">Builds one after another in the open Editor, each with its store's release values (pushed to Unity before each build), and records version, commit and What's new. Uploading stays per store.</p>
    <div class="actions"><button class="btn primary" data-act="build-all">${ic("construction")}Build selected</button></div></div>`;
}

const views = {
  async start(start) {
    return `<div class="start"><h1>Release Desk</h1><p>Open a Unity project. The desk reads its settings and its Store/ folder.</p>
      <div class="actions"><button class="btn primary" data-act="browse">${ic("folder_open")}Open Unity project…</button></div>
      ${start.recent.length ? `<div class="recent"><h3 class="note">Recent</h3>${start.recent.map(p => `<button class="copy" data-recent="${esc(p)}">${ic("folder")}${esc(p)}</button>`).join("")}</div>` : ""}</div>`;
  },
  async overview() {
    const [o, r] = await Promise.all([api("/api/overview"), api("/api/release")]);
    const cards = o.stores.map(s => s.later
      ? `<a class="box card" href="#${s.id}"><b>${storeIcon(s.id)}${esc(s.name)}</b><small>Later</small></a>`
      : `<a class="box card" href="#${s.id}"><b>${storeIcon(s.id)}${esc(s.name)}</b><div class="meter"><i style="width:${Math.round(100 * s.done / s.total)}%"></i></div><small>${s.done} of ${s.total} done · next: ${esc(s.next)}</small></a>`).join("");
    const rows = o.sync.map(r => `<tr><td>${esc(r.label)}</td><td class="mono">${esc(r.desk)}</td><td class="mono">${esc(r.unity)}</td><td>${r.same ? chip("ok", "same") : chip("warn", "differs")}</td></tr>`).join("");
    return `<div class="head"><div><h2>Overview</h2><p>Unity ${esc(o.editor)} · Store data ${o.hasStore ? "found" : "missing (add a Store/ folder with store.json)"}</p></div>
</div>
      <div class="cards">${cards}</div>
      ${releaseBox(r)}${perStore(r)}${buildAllBox(r)}
      <div class="box"><h3>Synced to Unity</h3><table><tr><th>Setting</th><th>Desk</th><th>Unity</th><th></th></tr>${rows}</table>
        <p class="note">Push to Unity writes these into PlayerSettings in the open Editor.</p><div class="actions"><button class="btn" data-act="push-unity">${ic("sync")}Push to Unity</button></div></div>
      <div id="jobs"></div>`;
  },
  async steam() {
    const [s, r] = await Promise.all([api("/api/steam"), api("/api/release")]);
    const done = s.steps.filter(x => x.state === "ok").length;
    $("#nav-steam").textContent = `${done}/${s.steps.length}`;
    const tabs = ["listing", "builds", "steps"].map(t => `<button role="tab" aria-selected="${t === steamTab}" data-tab="${t}">${{listing: "Listing", builds: "Builds", steps: "Setup steps"}[t]}</button>`).join("");
    let body = "";
    if (steamTab === "listing") {
      const fields = s.fields.map(f => `<div class="field"><label for="st-${f.key}">${esc(f.label)}</label>
        ${f.multiline ? `<textarea id="st-${f.key}" class="in" rows="5">${esc(f.value)}</textarea>` : `<input id="st-${f.key}" class="in" value="${esc(f.value)}">`}
        <div><span class="meta">${f.value.length}${f.max ? " / " + f.max : ""}</span> <button class="copy" data-copyfrom="st-${f.key}">${ic("content_copy")}Copy</button>${f.problem ? "<br>" + chip("bad", f.problem) : ""}</div></div>`).join("");
      const shots = s.screenshots.items.map(x => `${esc(x.file)} ${x.ok ? "" : "(" + esc(x.size) + ", not usable)"}`).join(", ") || "none yet";
      body = `${releaseBox(r, "steam")}<div class="box"><h3>Text</h3>${fields}<div class="actions"><button class="btn primary" data-act="save-steam">${ic("save")}Save</button></div></div>
        ${artBox("steam", s)}
        ${await shotsBox("steam", s.screenshots)}`;
    } else if (steamTab === "builds") {
      const b = s.build;
      body = `<div class="box">${buildTable("steam", b.history, [["uploaded", "Steam", h => h.uploaded ? chip("ok", h.uploaded) : h.exists ? chip("hand", "not uploaded") : chip("hand", "replaced")]])}
        <p class="note mono">${esc(b.folder)}</p>
        <div class="actions"><button class="btn" data-act="build" data-kind="steam-windows">${ic("build")}Build Windows</button><button class="btn" data-act="run-win" ${b.exists ? "" : "disabled"}>${ic("play_arrow")}Run</button><button class="btn" data-act="upload-preview">${ic("visibility")}Upload preview (nothing sent)</button><button class="btn primary" data-act="upload">${ic("cloud_upload")}Upload to ${esc(s.branch)}</button></div>
        <p class="note">Unity must be open on this project. Uploads use the SteamCMD login cached by your one-time terminal login; the desk never sees the password.</p></div>`;
    } else {
      body = stepsBox(s.steps);
    }
    return `<div class="head"><div><h2>Steam</h2><p>Builds upload through SteamCMD. The store page has no public API, so copy each value into Steamworks.</p></div>
</div>
      <div class="tabs" role="tablist">${tabs}</div><div id="jobs"></div>${body}`;
  },
  async epic() {
    const [e, r] = await Promise.all([api("/api/epic"), api("/api/release")]);
    const done = e.steps.filter(x => x.state === "ok").length;
    $("#nav-epic").textContent = `${done}/${e.steps.length}`;
    let body = "";
    if (epicTab === "listing") {
      const fields = e.fields.map(f => `<div class="field"><label for="ep-${f.key}">${esc(f.label)}</label>
        <div>${f.multiline ? `<textarea id="ep-${f.key}" class="in" rows="8">${esc(f.value)}</textarea>` : `<input id="${f.readonly ? "ep-ro-" : "ep-"}${f.key}" class="in" value="${esc(f.value)}" ${f.readonly ? "disabled" : ""}>`}${f.note ? `<div class="note">${esc(f.note)}</div>` : ""}</div>
        <div><span class="meta">${f.value.length}${f.max ? " / " + f.max : ""}</span> <button class="copy" data-copyfrom="${f.readonly ? "ep-ro-" : "ep-"}${f.key}">${ic("content_copy")}Copy</button>${f.problem ? "<br>" + chip("bad", f.problem) : ""}</div></div>`).join("");
      body = `${releaseBox(r, "epic")}<div class="box"><h3>Text</h3>${fields}<div class="actions"><button class="btn primary" data-act="save-epic">${ic("save")}Save</button></div>
        <p class="note">Epic has no public API for the store page; copy each value into the Developer Portal.</p></div>
        ${artBox("epic", e)}${await shotsBox("epic", e.screenshots)}`;
    } else if (epicTab === "builds") {
      const b = e.build, k = e.key;
      body = `<div class="box">${buildTable("epic", b.history, [["uploaded", "Epic", h => h.uploaded ? chip("ok", h.uploaded) : h.exists ? chip("hand", "not uploaded") : chip("hand", "replaced")]])}
        <p class="note mono">${esc(b.folder)}</p>
        <div class="actions"><button class="btn" data-act="build" data-kind="epic-windows">${ic("build")}Build Windows</button><button class="btn" data-act="run-win" data-kind="epic-windows" ${b.exists ? "" : "disabled"}>${ic("play_arrow")}Run</button>
          <button class="btn" data-act="epic-check" ${k.ready ? "" : "disabled"}>${ic("check")}Check connection</button><button class="btn primary" data-act="epic-upload" ${k.ready && b.exists ? "" : "disabled"}>${ic("cloud_upload")}Upload to Dev sandbox</button></div>
        <p class="note">Unity must be open on this project. Check connection lists the binaries Epic has (changes nothing). Uploads use Epic's BuildPatch Tool with the client secret from Credential Manager; the desk never sees it. Attach the uploaded binary to the Windows platform in the Developer Portal.</p></div>`;
    } else {
      body = stepsBox(e.steps);
    }
    return `<div class="head"><div><h2>Epic Games Store</h2><p>Builds upload through Epic's BuildPatch Tool. The store page has no public API, so copy each value into the Developer Portal.</p></div></div>
      ${tabBar(epicTab, {listing: "Listing", builds: "Builds", steps: "Setup steps"})}<div id="jobs"></div>${body}`;
  },
  async play() {
    const [p, r] = await Promise.all([api("/api/play"), api("/api/release")]);
    const done = p.steps.filter(x => x.state === "ok").length;
    $("#nav-play").textContent = `${done}/${p.steps.length}`;
    let body = "";
    if (playTab === "listing") {
      const fields = p.fields.map(f => `<div class="field"><label for="pl-${f.key}">${esc(f.label)}</label>
        <div>${f.multiline ? `<textarea id="pl-${f.key}" class="in" rows="6">${esc(f.value)}</textarea>` : `<input id="${f.readonly ? "pl-ro-" : "pl-"}${f.key}" class="in" value="${esc(f.value)}" ${f.readonly ? "disabled" : ""}>`}${f.note ? `<div class="note">${esc(f.note)}</div>` : ""}</div>
        <div><span class="meta">${f.value.length}${f.max ? " / " + f.max : ""}</span>${f.problem ? "<br>" + chip("bad", f.problem) : ""}</div></div>`).join("");
      body = `${releaseBox(r, "play")}<div class="box"><h3>Text · ${esc(p.language)}</h3>${fields}<div class="actions"><button class="btn primary" data-act="save-play">${ic("save")}Save</button></div>
        <p class="note">Uploaded with each publish through the Play Developer API.</p></div>
        ${artBox("play", p)}${await shotsBox("play", p.screenshots)}`;
    } else if (playTab === "builds") {
      const phones = p.phones.devices.length ? p.phones.devices.map(d => `${esc(d.model)} ${d.state === "device" ? chip("ok", "ready") : chip("warn", d.state)}`).join(", ") : chip("hand", "no phone connected");
      const apk = p.builds[0], key = p.key, account = p.account;
      body = `<div class="box">${buildTable("play", p.history, [["kind", "Type", h => esc(h.kind === "play-aab" ? "Release AAB" : "Phone test APK")], ["file", "File", h => `<span class="mono">${esc(h.path.split(/[\\/]/).pop())}</span>${h.exists ? "" : " " + chip("hand", "deleted")}`], ["uploaded", "Play", h => h.kind !== "play-aab" ? "" : h.uploaded ? chip("ok", h.uploaded) : chip("hand", "not uploaded")]])}
        <p>Phone: ${phones}</p>
        <div class="actions"><button class="btn" data-act="build" data-kind="play-dev-apk">${ic("build")}Build phone test APK</button><button class="btn" data-act="install" ${apk.exists ? "" : "disabled"}>${ic("install_mobile")}Install on phone</button>
          <button class="btn" data-act="build" data-kind="play-aab" ${key.ready ? "" : 'disabled title="Create the upload key first (Keys & accounts)"'}>${ic("build")}Build release AAB</button></div>
        <p class="note">Unity must be open on this project. An Android build switches Unity to Android and back, so the first one takes long. The release AAB is signed with the upload key; Unity reads its password from Credential Manager.</p></div>
        <div class="box"><h3>Publish</h3>
        <div class="field"><label for="play-track">Track</label><select id="play-track" class="in">${Object.entries(p.tracks).map(([k, v]) => `<option value="${k}" ${k === p.play.track ? "selected" : ""}>${esc(v)}</option>`).join("")}</select><span></span></div>
        <div class="field"><label for="play-status">Release</label><div><select id="play-status" class="in">${Object.entries(p.statuses).map(([k, v]) => `<option value="${k}" ${k === p.play.status ? "selected" : ""}>${esc(v)}</option>`).join("")}</select><div class="note">Draft waits for your click in Play Console and is the only kind Play accepts until the app's first release is published.</div></div><button class="btn" data-act="save-play-settings">${ic("save")}Save</button></div>
        <p>Uploads the newest release AAB with What's new as release notes, the listing text, icon, feature graphic and phone screenshots in one edit.</p>
        <div class="actions"><button class="btn" data-act="play-check" ${account.found && p.key.package ? "" : "disabled"}>${ic("check")}Check Play</button><button class="btn" data-act="play-preview" ${p.aab.exists && account.found ? "" : "disabled"}>${ic("visibility")}Publish preview (validated, nothing changes)</button><button class="btn primary" data-act="play-publish" ${p.aab.exists && account.found ? "" : "disabled"}>${ic("publish")}Publish to ${esc(p.play.track)}</button></div>
        <p class="note">${account.found ? `Service account ${esc(account.email)}.` : `Set ${esc(account.env)} to the service account JSON (Setup steps).`} Check Play lists what each track holds and the highest version code (changes nothing). After a publish the build number goes up by one for the next upload.</p></div>`;
    } else {
      body = stepsBox(p.steps);
    }
    return `<div class="head"><div><h2>Google Play</h2><p>Builds, listing and art publish through the Play Developer API. The first upload and the questionnaires are done once in Play Console.</p></div>
</div>
      ${tabBar(playTab, {listing: "Listing", builds: "Builds", steps: "Setup steps"})}<div id="jobs"></div>${body}`;
  },
  async keys() {
    const k = await api("/api/keys");
    const c = k.steamcmd;
    return `<div class="head"><div><h2>Keys &amp; accounts</h2><p>The desk never shows or stores passwords. It only checks that each login exists where it should.</p></div></div>
      <div class="box"><h3>Steam</h3>
        <div class="field"><label for="steam-user">Build account name</label><input id="steam-user" class="in" value="${esc(c.user)}" placeholder="not your main Steam account"><button class="btn" data-act="save-user">${ic("save")}Save</button></div>
        <table><tr><td>SteamCMD</td><td class="mono">${esc(c.path)}</td><td>${c.installed ? chip("ok", "installed") : chip("bad", "missing")}</td></tr>
        <tr><td>Cached login</td><td class="mono">"${esc(c.path)}" +login ${esc(c.user || "<account>")}</td><td>${c.loggedIn ? chip("ok", "logged in") : chip("bad", "not yet")} <button class="copy" data-text="&quot;${esc(c.path)}&quot; +login ${esc(c.user || "")}">${ic("content_copy")}Copy</button></td></tr></table>
        <p class="note">To install SteamCMD, download the official zip from Valve (${esc("https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip")}) and unpack it into the folder above. Then run the login command once in a terminal and enter the password and Steam Guard code there.</p></div>
      <div class="box"><h3>Epic Games Store</h3>
        <table><tr><td>BuildPatch Tool</td><td class="mono">${esc(k.epic.bpt || k.epic.bptFolder)}</td><td>${k.epic.installed ? chip("ok", "found") : chip("bad", "missing")}</td></tr>
        <tr><td>IDs (Store/store.json "epic")</td><td class="mono">${Object.entries(k.epic.ids).map(([n, v]) => `${esc(n)}: ${esc(v || "—")}`).join("<br>")}</td><td>${k.epic.missing.length ? chip("bad", k.epic.missing.length + " missing") : chip("ok", "set")}</td></tr>
        <tr><td>Client secret</td><td class="mono">Credential Manager: ${esc(k.epic.credential)}</td><td>${k.epic.stored ? chip("ok", "stored") : chip("bad", "missing")}</td></tr></table>
        <div class="actions"><button class="btn" data-act="epic-secret" ${k.epic.ids.productId && k.epic.ids.clientId ? "" : "disabled"}>${ic("key")}Save BPT secret</button></div>
        <p class="note">Download the BuildPatch Tool from the Developer Portal (Artifacts and Binaries) and unzip it into the folder above. Save BPT secret opens a console where cmdkey asks for the secret; the desk never sees it.</p></div>
      <div class="box"><h3>Google Play</h3>
        <table><tr><td>Upload keystore</td><td class="mono">${esc(k.play.key.keystore)}</td><td>${k.play.key.exists ? chip("ok", "found") : chip("bad", "missing")}</td></tr>
        <tr><td>Password</td><td class="mono">Credential Manager: ${esc(k.play.key.credential)}</td><td>${k.play.key.stored ? chip("ok", "stored") : chip("bad", "missing")}</td></tr>
        <tr><td>Service account</td><td class="mono">${esc(k.play.account.env)}${k.play.account.email ? " · " + esc(k.play.account.email) : ""}</td><td>${k.play.account.found ? chip("ok", "found") : k.play.account.set ? chip("bad", "not readable") : chip("bad", "not set")}</td></tr></table>
        <div class="actions"><button class="btn" data-act="play-key" ${k.play.key.ready || !k.play.key.package ? "disabled" : ""}>${ic("key")}Create upload key</button></div>
        <p class="note">${k.play.key.package ? "Create upload key opens a console window: keytool creates the keystore and cmdkey stores the password; both ask for it there. Back up the keystore outside every repository; Play App Signing keeps the release key." : "Set android.package in Store/store.json first."}</p></div>
      <div class="box"><h3>Unity</h3><p>Unity CLI ${k.unityCli ? chip("ok", "found") : chip("bad", "missing")}</p></div>`;
  },
  async log() {
    const l = await api("/api/log");
    const tools = Object.entries(l.tools).filter(([, t]) => t).map(([n, t]) => `<div class="box"><h3>${esc(n)}</h3><pre class="log">${esc(t)}</pre></div>`).join("");
    const history = l.history.slice(1).map(h => `<pre class="log" style="margin-bottom:8px">${esc(h)}</pre>`).join("") || `<p class="note">No earlier runs.</p>`;
    return `<div class="head"><div><h2>Log</h2><p>Files in Store/Logs: latest.txt is the summary to read first; history.txt keeps every run.</p></div><div class="actions"><button class="btn" data-act="copy-log">${ic("content_copy")}Copy latest</button></div></div>
      <div class="box"><h3>Latest run</h3><pre class="log" id="logtext">${esc(l.text || "No runs yet.")}</pre></div>
      ${tools}
      <div class="box"><h3>Earlier runs</h3>${history}</div>`;
  },
};

function artBox(store, s) {
  const rows = s.art.map(a => `<tr><td>${a.state !== "missing" && a.state !== "optional" && /\.(png|jpg)$/.test(a.file) ? `<img class="thumb" src="/store-file/${encodeURI(a.file)}?t=${Date.now()}" alt="">` : ""}${esc(a.label)}</td><td class="mono">${esc(a.expected)}</td><td class="mono">${esc(a.file)}</td><td>${
    a.state === "ok" ? chip("ok", "ok") : a.state === "optional" ? chip("hand", "optional") : a.state === "missing" ? chip("bad", "missing") : chip("bad", a.problem)}</td></tr>`).join("");
  return `<div class="box"><h3>Art · Store/${store}/art</h3><table><tr><th>Image</th><th>Size</th><th>File</th><th></th></tr>${rows}</table>
    <p class="note">Put each image at the file name shown (PNG unless noted), or make them. Sizes from the store's docs, checked ${esc(s.rules.checked)}.</p>
    <div class="actions"><button class="btn" data-act="capsules">${ic("view_quilt")}Make capsules</button><button class="btn" data-act="icons">${ic("apps")}Make icons</button></div>
    <p class="note">Make capsules crops the key art (Store/shots/art/key-art.png, from the key-art shot) to each size and places the logo (Store/art/logo.png); focus and logo boxes can be tuned per output in Store/art.json. Make icons resizes Store/art/icon.png (square, 1024×1024) to every store icon size. Both write every store's files.</p></div>`;
}
const stepsBox = steps => `<div class="box"><ol class="steps">${steps.map(x => `<li>${mark(x.state)}<div><div class="t">${esc(x.title)}</div><div class="d">${esc(x.detail)}${x.link ? ` <a href="${esc(x.link)}" target="_blank" rel="noopener">Open ${ic("open_in_new")}</a>` : ""}</div></div>${kindChip(x.kind)}</li>`).join("")}</ol></div>`;
const tabBar = (current, names) => `<div class="tabs" role="tablist">${Object.entries(names).map(([t, label]) => `<button role="tab" aria-selected="${t === current}" data-tab="${t}">${label}</button>`).join("")}</div>`;
async function shotsBox(store, summary) {
  const list = (await api("/api/shots")).shots.filter(x => (x.stores || []).includes(store));
  const cards = list.map(x => {
    const f = x.files.find(f => f.store === store);
    return `<figure class="shot">${f ? `<img src="/store-file/${encodeURI(f.file)}?t=${encodeURIComponent(f.made)}" alt="${esc(x.name)}" loading="lazy">` : `<div class="noshot">${ic("image_not_supported")} not captured</div>`}
      <figcaption><span class="mono">${esc(x.name)}</span> <span class="note">${x.width}×${x.height}${f ? " · " + esc(f.made) : ""}</span>
      <button class="copy" data-act="capture" data-only="${esc(x.name)}">${ic("photo_camera")}Capture</button></figcaption></figure>`;
  }).join("");
  return `<div class="box"><h3>Screenshots · Store/shots/${esc(store)}</h3>
    <p>${summary.good} of ${summary.min} usable. Each shot is set up by its Flecs Script in Store/shots.json; Unity plays, renders the exact size without UI, and returns to edit mode.</p>
    <div class="shots">${cards || `<p class="note">No shots for this store in Store/shots.json.</p>`}</div>
    <div class="actions"><button class="btn primary" data-act="capture">${ic("photo_camera")}Capture all</button></div><p class="note">${esc(summary.note)}</p></div>`;
}
const mmss = sec => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
function jobsBox(jobs) {
  const names = Object.keys(jobs || {});
  if (!names.length) return "";
  return `<div class="box"><h3>Runs</h3>${names.map(n => {
    const j = jobs[n];
    if (j.state === "running")
      return `<div class="job"><b>${esc(n)}</b> ${chip("warn", "running " + mmss(j.elapsed || 0))}<div class="progress"><i></i></div><span class="note">${esc(j.activity || "Working…")}</span></div>`;
    const took = j.ended && j.started ? " · " + mmss(Math.round(j.ended - j.started)) : "";
    return `<div class="job"><b>${esc(n)}</b> ${chip(j.state === "done" ? "ok" : "bad", j.state + took)} <span class="mono">${esc(j.message)}</span></div>`;
  }).join("")}</div>`;
}

// Build history table, sortable by any column when there is more than one build.
const sorts = {};
function buildTable(id, rows, extra) {
  const cols = [["version", "Version", h => `<span class="mono">${esc(h.version)} (${esc(h.build)})</span>`],
    ["branch", "Branch", h => `<span class="mono">${esc(h.branch || "—")}</span> <span class="note mono">${esc(h.commit || "")}</span>`],
    ["minutes", "Build time", h => h.minutes != null ? `${h.minutes} min` : "—"],
    ["sizeMB", "Size", h => h.sizeMB != null ? `<span class="mono">${h.sizeMB} MB</span>` : "—"],
    ["finished", "Made", h => esc(h.finished)],
    ["changes", "Changes", h => (h.changes || []).length ? `<ul class="changes">${h.changes.map(c => `<li>${esc(c)}</li>`).join("")}</ul><button class="copy" data-text="${esc(h.changes.map(c => "• " + c).join("\n"))}">${ic("content_copy")}Copy</button>` : "—"], ...extra];
  if (!rows.length) return `<p class="note">No builds yet.</p>`;
  const st = sorts[id] || {key: "finished", dir: -1};
  const val = (h, k) => k === "version" ? String(h.version).split(".").map(n => n.padStart(5, "0")).join(".") + String(h.build).padStart(8, "0")
    : typeof h[k] === "number" ? h[k] : String(h[k] ?? "");
  const sorted = [...rows].sort((a, b) => { const x = val(a, st.key), y = val(b, st.key); return (x > y ? 1 : x < y ? -1 : 0) * st.dir; });
  const head = cols.map(([k, label]) => rows.length > 1 ? `<th class="sort" data-sort="${id}:${k}" ${st.key === k ? `data-dir="${st.dir > 0 ? "arrow_upward" : "arrow_downward"}"` : ""}>${label}</th>` : `<th>${label}</th>`).join("");
  const body = sorted.map(h => `<tr>${cols.map(([, , f]) => `<td>${f(h)}</td>`).join("")}${h.result && h.result !== "Succeeded" ? `<td>${chip("bad", h.result)}</td>` : ""}</tr>`).join("");
  return `<table><tr>${head}</tr>${body}</table>`;
}

let renderSeq = 0;
async function render() {
  const seq = ++renderSeq;  // a slower, older render must not overwrite a newer one
  const view = (location.hash || "#overview").slice(1);
  document.querySelectorAll("#nav a").forEach(a => a.getAttribute("href") === "#" + view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const start = await api("/api/start").catch(() => ({project: "", recent: []}));
  let html;
  try { html = start.project ? await (views[view] || views.overview)() : await views.start(start); }
  catch (e) { html = `<div class="box">${chip("bad", "error")} ${esc(e.message)}</div>`; }
  if (seq !== renderSeq) return;
  $("#wrap").classList.toggle("empty", !start.project);
  $("#proj").textContent = start.project;
  $("#title").textContent = start.title || "Release Desk";
  document.title = start.title ? `${start.title} · Release Desk` : "Release Desk";
  $("#main").innerHTML = html;
  trackEdits();
  updateJobs();
}

// Save buttons appear only while their box differs from what was loaded.
const saveScope = b => b.closest(".field:has(input + button[data-act^=save])") || b.closest(".box");
const snapshot = scope => JSON.stringify([...scope.querySelectorAll("input,textarea,select")].map(el => el.type === "checkbox" ? el.checked : el.value));
function trackEdits() {
  document.querySelectorAll("#main [data-act^=save]").forEach(b => { b.dataset.loaded = snapshot(saveScope(b)); b.hidden = true; });
}
function edited(e) {
  document.querySelectorAll("#main [data-act^=save]").forEach(b => { if (saveScope(b).contains(e.target)) b.hidden = snapshot(saveScope(b)) === b.dataset.loaded; });
}
document.addEventListener("input", edited);
window.addEventListener("hashchange", render);

// Live progress: while any run is going, refresh the Runs box every 3 s; when it ends, redraw the page.
let polling = null, wasRunning = false;
async function updateJobs() {
  const jobs = await api("/api/jobs").catch(() => ({}));
  const box = $("#jobs");
  if (box) box.innerHTML = jobsBox(jobs);
  const running = Object.values(jobs).some(j => j.state === "running");
  if (running && !polling) polling = setInterval(updateJobs, 3000);
  if (!running && polling) { clearInterval(polling); polling = null; }
  if (wasRunning && !running) { wasRunning = false; return render(); }
  wasRunning = running;
}

document.addEventListener("change", e => {
  edited(e);
  const ov = e.target.closest("[data-ov]");
  if (ov) { const input = $("#rel-" + ov.dataset.ov); input.disabled = !ov.checked; if (ov.checked) input.focus(); }
});
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-tab],[data-copyfrom],[data-text],[data-recent],[data-sort]");
  if (!t) return;
  try {
    if (t.dataset.sort) { const [id, key] = t.dataset.sort.split(":"); const cur = sorts[id] || {key: "finished", dir: -1}; sorts[id] = {key, dir: cur.key === key ? -cur.dir : -1}; return render(); }
    if (t.dataset.tab) { if (location.hash === "#play") playTab = t.dataset.tab; else if (location.hash === "#epic") epicTab = t.dataset.tab; else steamTab = t.dataset.tab; return render(); }
    if (t.dataset.copyfrom) return copy($("#" + t.dataset.copyfrom).value);
    if (t.dataset.text !== undefined) return copy(t.dataset.text);
    if (t.dataset.recent) { await api("/api/open", {path: t.dataset.recent}); location.hash = "#overview"; return render(); }
    const act = t.dataset.act;
    if (act === "browse") { const b = await api("/api/browse", {start: $("#proj").textContent}); if (!b.path) return; await api("/api/open", {path: b.path}); location.hash = "#overview"; return render(); }
    if (act === "refresh") { await api("/api/refresh", {}); toast("Refreshed; summary written to the log"); return render(); }
    if (act === "save-release") {
      const values = {}, override = {};
      document.querySelectorAll("[id^=rel-]").forEach(el => values[el.id.slice(4)] = el.value);
      document.querySelectorAll("[data-ov]").forEach(el => override[el.dataset.ov] = el.checked);
      await api("/api/release", {store: t.dataset.store, values, override}); toast("Saved to Store/store.json"); return render();
    }
    if (act === "draft") { const d = await api("/api/release/draft", {}); $("#rel-whatsNew").value = d.text || ""; $("#rel-whatsNew").dispatchEvent(new Event("input", {bubbles: true})); return toast(d.text ? "Release notes from commits; edit, then Save" : "No Release-note lines in commits since the last build"); }
    if (act === "build-all") { const kinds = [...document.querySelectorAll("[data-kind-pick]:checked")].map(el => el.dataset.kindPick); await api("/api/build/all", {kinds}); toast("Started; progress shows under Runs"); return updateJobs(); }
    if (act === "save-steam") { const d = {}; document.querySelectorAll("[id^=st-]").forEach(el => d[el.id.slice(3)] = el.value); await api("/api/steam/listing", d); toast("Saved to Store/steam/listing.json"); return render(); }
    if (act === "save-play") { const d = {}; document.querySelectorAll("[id^=pl-]").forEach(el => { if (!el.id.startsWith("pl-ro-")) d[el.id.slice(3)] = el.value; }); await api("/api/play/listing", d); toast("Saved to Store/play/listing.json"); return render(); }
    if (act === "save-epic") { const d = {}; document.querySelectorAll("[id^=ep-]").forEach(el => { if (!el.id.startsWith("ep-ro-")) d[el.id.slice(3)] = el.value; }); await api("/api/epic/listing", d); toast("Saved to Store/epic/listing.json"); return render(); }
    if (act === "epic-secret") { const k = await api("/api/epic/secret", {}); return toast(k.message); }
    if (act === "save-play-settings") { await api("/api/play/settings", {track: $("#play-track").value, status: $("#play-status").value}); toast("Saved to Store/store.json"); return render(); }
    if (act === "play-key") { const k = await api("/api/play/key", {}); return toast(k.message); }
    if (act === "save-user") { await api("/api/keys/steam-user", {user: $("#steam-user").value}); toast("Saved"); return render(); }
    if (act === "copy-log") return copy($("#logtext").textContent);
    if (act === "run-win") { const r = await api("/api/run/windows", {kind: t.dataset.kind || "steam-windows"}); return toast(r.message); }
    const jobs = {"push-unity": ["/api/unity/apply", {}], "build": ["/api/build", {kind: t.dataset.kind}], "install": ["/api/play/install", {}], "capture": ["/api/shots/capture", {only: t.dataset.only || ""}], "icons": ["/api/art/icons", {}], "capsules": ["/api/art/capsules", {}], "play-preview": ["/api/play/publish", {preview: true}], "play-check": ["/api/play/check", {}], "epic-check": ["/api/epic/check", {}], "epic-upload": ["/api/epic/upload", {}], "play-publish": ["/api/play/publish", {preview: false}], "upload-preview": ["/api/steam/upload", {preview: true}], "upload": ["/api/steam/upload", {preview: false}]};
    if (jobs[act]) { await api(...jobs[act]); toast("Started; progress shows under Runs"); updateJobs(); }
  } catch (err) { toast(err.message); }
});
render();
</script>
</body>
</html>
